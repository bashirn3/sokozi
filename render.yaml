# Render blueprint for the Sokozi Medusa backend.
# Deploy at: https://dashboard.render.com/select-repo?type=blueprint
#
# The Medusa backend cannot run on Vercel: it needs PostgreSQL and a
# long-running server. Vercel hosts the storefront only.
#
# Region is set explicitly to frankfurt on both the database and the service.
# Render cannot change a resource's region after creation, so getting this
# wrong means deleting and recreating everything.
#
# See DEPLOY-BACKEND.md for the one-time post-deploy steps.

databases:
  - name: sokozi-db
    databaseName: sokozi
    user: sokozi
    region: frankfurt
    # Not free. Free Postgres on Render expires and is deleted.
    plan: basic-256mb

services:
  - type: web
    name: sokozi-backend
    runtime: node
    region: frankfurt
    # Not free. Free web services sleep when idle, and the first request after
    # a sleep is slow enough to look broken in a demo.
    plan: starter
    rootDir: apps/backend
    buildCommand: cd ../.. && corepack enable && pnpm install --filter @dtc/backend... && pnpm --filter @dtc/backend build
    # db:migrate also runs the data migration scripts in src/migration-scripts,
    # which includes the Sokozi seed. Medusa records each one in the
    # script_migrations table, so the seed runs exactly once on a fresh
    # database and is skipped on every deploy after that.
    # Do not add a seed step here, and do not run the seed by hand afterwards.
    startCommand: cd ../.. && pnpm --filter @dtc/backend exec medusa db:migrate && pnpm --filter @dtc/backend start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: sokozi-db
          property: connectionString
      # Generated by Render and never committed or pasted by a human.
      # Rotating either one invalidates existing sessions. See DEPLOY-BACKEND.md.
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # These must be the exact deployed storefront origins, no trailing slash.
      # Update all three when the Vercel domain changes.
      - key: STORE_CORS
        value: https://storefront-inky-iota.vercel.app,http://localhost:8000
      - key: ADMIN_CORS
        value: https://storefront-inky-iota.vercel.app,http://localhost:9000
      - key: AUTH_CORS
        value: https://storefront-inky-iota.vercel.app,http://localhost:8000,http://localhost:9000
      # Stripe. Set these in the Render dashboard, never in this file.
      # Test keys until the live webhook endpoint exists.
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
