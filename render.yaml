# Render blueprint for Sokozi Medusa backend
# Deploy at: https://dashboard.render.com/select-repo?type=blueprint
#
# Note: Medusa backend cannot run on Vercel (needs PostgreSQL + long-running server).
# Use Medusa Cloud (recommended) or this Render setup.

databases:
  - name: sokozi-db
    databaseName: sokozi
    user: sokozi
    plan: free

services:
  - type: web
    name: sokozi-backend
    runtime: node
    plan: free
    rootDir: apps/backend
    buildCommand: cd ../.. && corepack enable && pnpm install --filter @dtc/backend... && pnpm --filter @dtc/backend build
    startCommand: cd ../.. && pnpm --filter @dtc/backend exec medusa db:migrate && pnpm --filter @dtc/backend start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: sokozi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        value: https://storefront-inky-iota.vercel.app,http://localhost:8000
      - key: ADMIN_CORS
        value: https://storefront-inky-iota.vercel.app,http://localhost:9000
      - key: AUTH_CORS
        value: https://storefront-inky-iota.vercel.app,http://localhost:8000,http://localhost:9000
